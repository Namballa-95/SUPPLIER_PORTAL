
_schema-version: 3.3.0
ID: business_partner
version: 1.0.0
description: "A simple CAP project."

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:

  # =========================================================
  # HANA DATABASE DEPLOYER
  # =========================================================

  - name: business_partner-db-deployer
    type: hdb
    path: gen/db

    parameters:
      buildpack: nodejs_buildpack

    requires:
      - name: business_partner-db
        properties:
          TARGET_CONTAINER: ~{hdi-container-name}


  # =========================================================
  # CAP SERVICE
  # =========================================================

  - name: business_partner-srv
    type: nodejs
    path: gen/srv

    parameters:
      instances: 1
      buildpack: nodejs_buildpack

    build-parameters:
      builder: npm-ci

    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

    requires:
      - name: business_partner-destination
      - name: business_partner-auth
      - name: business_partner-db


  # =========================================================
  # APPLICATION ROUTER + SUPPLIER PORTAL UI
  # =========================================================

  - name: business_partner
    type: approuter.nodejs
    path: app/router

    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M

    build-parameters:
      builder: custom
      commands:
        - rm -rf resources
        - mkdir -p resources
        - cp -r ../supplierportal/webapp/. resources/

    requires:

      # CAP SERVICE
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

      # XSUAA AUTHENTICATION
      - name: business_partner-auth

      # DESTINATION SERVICE
      - name: business_partner-destination

    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}


# =========================================================
# RESOURCES
# =========================================================

resources:

  # ---------------------------------------------------------
  # HANA HDI CONTAINER
  # ---------------------------------------------------------

  - name: business_partner-db
    type: com.sap.xs.hdi-container

    parameters:
      service: hana
      service-plan: hdi-shared

    properties:
      hdi-container-name: ${service-name}


  # ---------------------------------------------------------
  # DESTINATION SERVICE
  # ---------------------------------------------------------

  - name: business_partner-destination
    type: org.cloudfoundry.managed-service

    parameters:
      service: destination
      service-plan: lite


  # ---------------------------------------------------------
  # XSUAA
  # ---------------------------------------------------------

  - name: business_partner-auth
    type: org.cloudfoundry.managed-service

    parameters:
      service: xsuaa
      service-plan: application

      path: ./xs-security.json

      config:
        xsappname: supplier-portal
        tenant-mode: dedicated

        oauth2-configuration:
          redirect-uris:
            - https://*~{app-api/app-uri}/**

    requires:
      - name: app-api
